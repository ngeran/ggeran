services:
  postgres:
    image: postgres:16-alpine
    container_name: lathe_cut_db
    environment:
      POSTGRES_USER: lathe
      POSTGRES_PASSWORD: lathe_secret
      POSTGRES_DB: lathe_cut
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lathe -d lathe_cut"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lathe_cut_app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgres://lathe:lathe_secret@postgres:5432/lathe_cut?sslmode=disable
      NEXTAUTH_SECRET: local-dev-secret-change-in-production
      NEXTAUTH_URL: http://localhost:3000
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
